{{ define "main" }}
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
  {{ partial "section-header.html" . }}
  <div class="flex flex-wrap gap-3">
    {{ range .Data.Terms.Alphabetical }}
    <a href="{{ .Page.RelPermalink }}" class="badge badge-platform text-sm px-4 py-2 hover:bg-ember-primary/30 transition-colors">
      {{ .Page.Title }} ({{ .Count }})
    </a>
    {{ end }}
  </div>
</div>
{{ end }}
