{{ define "main" }}
<div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-12">
  {{ partial "breadcrumbs.html" . }}

  <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 mb-8">
    <div>
      <h1 class="text-4xl font-bold text-text-primary mb-2">{{ .Title }}</h1>
      <p class="text-text-secondary">{{ .Description }}</p>
    </div>
    <a href="{{ .Site.Params.resume.file }}" download class="btn-primary btn-sm shrink-0">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
      Download PDF
    </a>
  </div>

  <div class="prose-ember mb-10">{{ .Content }}</div>

  <div class="ember-card overflow-hidden">
    <iframe src="{{ .Site.Params.resume.file }}" title="Resume PDF" class="w-full h-[80vh] border-0" loading="lazy"></iframe>
  </div>

  <p class="text-text-muted text-sm text-center mt-4">
    PDF not loading? <a href="{{ .Site.Params.resume.file }}" download class="text-ember-primary hover:underline">Download the resume directly</a>.
  </p>
</div>
{{ end }}
