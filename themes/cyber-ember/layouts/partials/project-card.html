{{- $page := . -}}
<article class="ember-card overflow-hidden group relative">
    <a href="{{ $page.RelPermalink }}" class="block">
    {{ with $page.Params.featured_image }}
    <div class="aspect-video overflow-hidden bg-ember-bg-secondary">
      <img src="{{ . }}" alt="{{ $page.Title }}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" loading="lazy" width="400" height="225">
    </div>
    {{ end }}
    <div class="p-5">
      {{ with $page.Params.status }}
      <div class="flex items-center gap-2 mb-3">
        <span class="badge badge-platform">{{ . }}</span>
      </div>
      {{ end }}
      <h3 class="text-text-primary font-semibold group-hover:text-ember-primary transition-colors mb-2">{{ $page.Title }}</h3>
      <p class="text-text-muted text-sm line-clamp-2 mb-3">{{ $page.Summary | default $page.Description | plainify | truncate 120 }}</p>
      {{ with $page.Params.technologies }}
      <div class="flex flex-wrap gap-1.5">
        {{ range first 4 . }}<span class="badge bg-ember-bg-secondary text-ember-soft text-xs">{{ . }}</span>{{ end }}
      </div>
      {{ end }}
    </div>
  </a>
</article>
