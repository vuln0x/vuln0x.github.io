<div class="mb-10">

  {{ with .Description }}
  <p class="text-text-secondary text-lg max-w-3xl">{{ . }}</p>
  {{ end }}
  {{ with .Content }}
  <div class="prose-ember mt-4 max-w-3xl">{{ . }}</div>
  {{ end }}
</div>
