{{- if and .TableOfContents (gt (len .TableOfContents) 32) -}}

<aside class="toc-sidebar hidden xl:block sticky top-24 max-h-[calc(100vh-var(--header-offset)-2rem)] overflow-y-auto" data-toc-sidebar aria-label="Table of contents">

  <nav class="toc-panel">

    <h2 class="toc-heading">Table of Contents</h2>

    <div class="toc-content">

      {{ .TableOfContents }}

    </div>

  </nav>

</aside>

{{- end -}}
