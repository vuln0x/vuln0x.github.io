<header id="site-header" class="sticky top-0 z-40 transition-all duration-300 border-b border-transparent">
  <div class="header-backdrop bg-ember-bg/80 backdrop-blur-xl">
    <nav class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8" aria-label="Main navigation">
      <div class="flex items-center justify-between h-16">
        <a href="{{ "/" | relURL }}" class="flex items-center gap-2 group">
          <img
            src="{{ .Site.Params.brand.logo | default "/images/logo.svg" }}"
            alt="{{ .Site.Params.brand.name }}"
            class="w-8 h-8 rounded-lg object-cover group-hover:shadow-glow transition-shadow"
            width="32"
            height="32"
          >
          <span class="hidden sm:block font-semibold text-text-primary text-sm">{{ .Site.Params.brand.name }}</span>
        </a>

        <div class="hidden lg:flex items-center gap-6">
          {{ range .Site.Menus.main }}
          <a href="{{ .URL }}" class="nav-link {{ if $.IsMenuCurrent "main" . }}nav-link-active{{ end }}">
            {{ .Name }}
          </a>
          {{ end }}
        </div>

        <div class="flex items-center gap-2">
          {{ if .Site.Params.search.enabled }}
          <button data-search-open class="p-2 text-text-muted hover:text-ember-primary transition-colors rounded-lg" aria-label="Search">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
          </button>
          {{ end }}

          <a href="{{ .Site.Params.social.github }}" target="_blank" rel="noopener noreferrer" class="hidden sm:flex p-2 text-text-muted hover:text-ember-primary transition-colors rounded-lg" aria-label="GitHub">
            <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
          </a>

          <button data-theme-toggle class="p-2 text-text-muted hover:text-ember-primary transition-colors rounded-lg" aria-label="Toggle theme">
            <svg data-icon="sun" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
            <svg data-icon="moon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
          </button>

          <a href="{{ "/resume/" | relURL }}" class="hidden md:inline-flex btn-primary btn-sm">Resume</a>

          <button id="mobile-menu-btn" class="lg:hidden p-2 text-text-muted hover:text-ember-primary transition-colors rounded-lg" aria-label="Open menu" aria-expanded="false">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
          </button>
        </div>
      </div>

      <div id="mobile-menu" class="hidden lg:hidden pb-4 border-t border-ember-border mt-2 pt-4">
        <div class="flex flex-col gap-3">
          {{ range .Site.Menus.main }}
          <a href="{{ .URL }}" class="nav-link py-2">{{ .Name }}</a>
          {{ end }}
          <a href="{{ "/resume/" | relURL }}" class="btn-primary btn-sm mt-2 text-center">Resume</a>
        </div>
      </div>
    </nav>
  </div>
</header>

<style>
  #site-header.scrolled {
    border-color: var(--color-border);
    box-shadow: var(--glow-subtle);
  }
</style>
