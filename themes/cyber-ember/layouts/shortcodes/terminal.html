<div class="terminal-window my-6">
  <div class="terminal-header">
    <span class="terminal-dot bg-red-500"></span>
    <span class="terminal-dot bg-yellow-500"></span>
    <span class="terminal-dot bg-green-500"></span>
    <span class="ml-2 text-text-muted text-xs">terminal</span>
  </div>
  <pre class="terminal-body font-mono text-sm text-text-secondary whitespace-pre-wrap m-0"><code>{{ .Inner | htmlEscape | strings.TrimSpace }}</code></pre>
</div>
