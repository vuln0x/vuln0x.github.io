# vuln0x Theme Parameters

description = 'Documenting my journey through cybersecurity, penetration testing, CTFs, research, and tool development.'
author = 'vuln0x'
tagline = 'Documenting my journey through cybersecurity, penetration testing, CTFs, research, and tool development.'

# Branding
[brand]
  name = 'vuln0x'
  title = 'Cybersecurity Student | Penetration Testing & Red Teaming Enthusiast'
  logo = '/images/logo.jpg'

# Social
[social]
  github = 'https://github.com/vuln0x'
  email = '@gmail.com'

# Analytics — Plausible (privacy-friendly)
[analytics]
  enabled = true
  provider = 'plausible'
  domain = 'vuln0x.github.io'

# Comments — Giscus
[comments]
  enabled = true
  provider = 'giscus'
  repo = 'vuln0x/vuln0x.github.io'
  repoId = 'R_kgDOS0PC0Q'
  category = 'Comments'
  categoryId = 'DIC_kwDOS0PC0c4C-vfD'
  mapping = 'pathname'
  theme = 'noborder_dark'
  lang = 'en'
  reactions = true
  writeups_default = false
  blog_default = true
  notes_default = true

# Search — Pagefind
[search]
  enabled = true
  provider = 'pagefind'

# SEO
[seo]
  twitter_card = 'summary_large_image'
  og_image = '/images/og/default.svg'
  google_site_verification = 'mfVDDGTzy77apV5OY-Qfb-7nYn0cilbezliN7ppYHOA'

# Homepage section order
[homepage]
  sections = [
    'hero',
    'featured_writeups',
    'featured_projects',
    'latest_articles',
    'stats',
    'activity_timeline',
  ]

# Difficulty colors
[difficulty]
  low = 'hsl(212, 71%, 45%)'
  easy = '#22C55E'
  medium = '#FF8C00'
  hard = '#EF4444'
  insane = '#A855F7'
  beginner = '#22C55E'
  intermediate = '#FF8C00'
  advanced = '#EF4444'
